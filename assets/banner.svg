<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".8"/></linearGradient></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(12px)}}.bg-pulse{animation:pulse 6s ease-in-out infinite;transform-origin:center}.route-line{stroke-dasharray:10 10;animation:dash 3s linear infinite}.float-card1{animation:float1 4s ease-in-out infinite}.float-card2{animation:float2 5s ease-in-out infinite}</style><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><circle cx="150" cy="80" r="180" fill="#38bdf8" class="bg-pulse"/><circle cx="1050" cy="260" r="200" fill="#c084fc" class="bg-pulse"/></g><g fill="none" stroke="url(#accentLine)" stroke-width="2" opacity=".4"><path d="M 100 280 Q 300 120 600 280 T 1100 100" class="route-line"/><path d="M 50 100 Q 400 320 800 100 T 1150 250" class="route-line"/></g><g class="float-card1" opacity=".85"><rect width="220" height="42" x="920" y="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="21"/><circle cx="945" cy="66" r="8" fill="#10b981"/><text x="962" y="71" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">1,400+ Carriers Active</text></g><g class