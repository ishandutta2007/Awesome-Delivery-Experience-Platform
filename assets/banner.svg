<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    .bg-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .route-line { stroke-dasharray: 10 10; animation: dash 3s linear infinite; }
    .float-card1 { animation: float1 4s ease-in-out infinite; }
    .float-card2 { animation: float2 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Animated Background Elements (Background layer) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="#38bdf8" class="bg-pulse"/>
    <circle cx="1050" cy="260" r="200" fill="#c084fc" class="bg-pulse"/>
  </g>

  <!-- Animated Delivery Network / Route Lines (Background Layer) -->
  <g stroke="url(#accentLine)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 100 280 Q 300 120 600 280 T 1100 100" class="route-line" />
    <path d="M 50 100 Q 400 320 800 100 T 1150 250" class="route-line" />
  </g>

  <!-- Floating Dynamic Tech Pills (Positioned around, not overlapping central text) -->
  <g class="float-card1" opacity="0.85">
    <!-- Top Right Pill -->
    <rect x="920" y="45" width="220" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="945" cy="66" r="8" fill="#10b981"/>
    <text x="962" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">1,400+ Carriers Active</text>
  </g>

  <g class="float-card2" opacity="0.85">
    <!-- Bottom Left Pill -->
    <rect x="60" y="245" width="240" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="85" cy="266" r="8" fill="#6366f1"/>
    <text x="102" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">📦 Real-Time Tracking</text>
  </g>

  <g class="float-card1" opacity="0.85">
    <!-- Bottom Right Pill -->
    <rect x="900" y="245" width="240" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="925" cy="266" r="8" fill="#f43f5e"/>
    <text x="942" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ Proactive Alerts & EDD</text>
  </g>

  <!-- Main Foreground Content (Clear & High Contrast) -->
  <!-- Icon & Badge -->
  <g transform="translate(60, 45)">
    <rect width="180" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="90" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">AWESOME ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="60" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-1">
    Awesome Delivery Experience Platform
  </text>

  <!-- Subtitle -->
  <text x="60" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Curated SaaS Products, Post-Purchase Tracking &amp; Open-Source Delivery Engines
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(60, 195)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      🚚 Post-Purchase Tracking &nbsp;•&nbsp; 🔔 WISMO Prevention &nbsp;•&nbsp; 🔄 Returns Management &nbsp;•&nbsp; 📍 Driver Apps &nbsp;•&nbsp; 📈 Market Insights
    </text>
  </g>
</svg>
